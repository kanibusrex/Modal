<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- tile background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"   stop-color="#222634"/>
      <stop offset="0.5" stop-color="#14171f"/>
      <stop offset="1"   stop-color="#0a0c10"/>
    </linearGradient>
    <!-- soft cool highlight, upper-left -->
    <radialGradient id="sheen" cx="0.3" cy="0.18" r="0.9">
      <stop offset="0"    stop-color="#5b7bb0" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#5b7bb0" stop-opacity="0"/>
    </radialGradient>
    <!-- glow behind the cursor -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#86c8e0" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#9b8be0" stop-opacity="0.30"/>
      <stop offset="1"   stop-color="#9b8be0" stop-opacity="0"/>
    </radialGradient>
    <!-- the cursor bar -->
    <linearGradient id="bar" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0"    stop-color="#6fc6d6"/>
      <stop offset="0.45" stop-color="#6aa6d8"/>
      <stop offset="1"    stop-color="#c49bea"/>
    </linearGradient>
    <!-- gloss on the bar -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.6"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1"    stop-color="#0a0c10" stop-opacity="0.16"/>
    </linearGradient>
    <!-- amber markers -->
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cf94"/>
      <stop offset="1" stop-color="#d6a559"/>
    </linearGradient>

    <clipPath id="tile">
      <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232"/>
    </clipPath>
  </defs>

  <!-- base tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>

  <!-- everything inside is clipped to the rounded tile -->
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sheen)"/>
    <!-- cursor glow -->
    <ellipse cx="636" cy="512" rx="360" ry="330" fill="url(#glow)"/>

    <!-- amber gutter markers -->
    <rect x="296" y="388" width="104" height="104" rx="30" fill="url(#amber)"/>
    <rect x="296" y="532" width="104" height="104" rx="30" fill="url(#amber)"/>

    <!-- cursor bar -->
    <rect x="544" y="300" width="176" height="424" rx="46" fill="url(#bar)"/>
    <rect x="544" y="300" width="176" height="424" rx="46" fill="url(#gloss)"/>
    <!-- thin top cap highlight -->
    <rect x="566" y="318" width="132" height="10" rx="5" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- crisp inner edge -->
  <rect x="3" y="3" width="1018" height="1018" rx="229" ry="229"
        fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
