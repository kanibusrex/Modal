name: Release

# Builds the desktop app for macOS, Windows, and Linux.
#
# - Push a tag like v1.2.0 → artifacts are attached to that tag's GitHub
#   release (created if it doesn't exist yet).
# - Run manually from the Actions tab → artifacts are uploaded to the run
#   for inspection, no release is touched.
#
# Typical release flow:
#   npm version 1.2.0        # bumps package.json + creates the v1.2.0 tag
#   git push --follow-tags

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificate in CI — skip identity discovery so the
      # macOS build doesn't fail looking for one.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Attach artifacts to the tag's release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

      - name: Upload artifacts (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: modal-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
